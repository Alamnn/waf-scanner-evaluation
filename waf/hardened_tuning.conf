# Hardened ModSecurity + OWASP CRS Custom Tuning Rules
# Placed in /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf (and custom after-rules)

# 1. Enable Blocking Mode (default Debian/Kali modsecurity.conf-recommended uses DetectionOnly)
SecRuleEngine On

# 2. Raise OWASP CRS Paranoia Level from PL1 (default) to PL2 to block obfuscated SQLi/XSS bypasses
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=2,\
    setvar:tx.executing_paranoia_level=2,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# 3. FALSE POSITIVE TUNING:
# (a) Allow numeric IP Host header in lab / internal IP environment (CRS rule 920350)
# Must use ctl:ruleRemoveById because REQUEST-900 is loaded before REQUEST-920
SecAction \
    "id:100005,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920350"
# (b) Allow legitimate rich-text / natural language containing SQL keywords
# ("select ... from ...") in the benign /note endpoint without disabling SQLi checks on /user
SecRule REQUEST_URI "@beginsWith /note" \
    "id:100010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:text"

# 4. CUSTOM RULE: Block SSRF against Cloud Metadata Service (169.254.169.254)
SecRule ARGS "@rx 169\.254\.169\.254|metadata\.google\.internal" \
    "id:100020,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom WAF Rule: Blocked Cloud Metadata SSRF Attempt',\
    tag:'attack-ssrf'"

# 5. CUSTOM RULE: Close CRS PL1/PL2 Command Injection Detection Gap on short UNIX commands (; id / | whoami / `id`)
SecRule ARGS "@rx (?:;|&&|\|\||\|)\s*(?:id|whoami|uname|cat|ls|pwd|sh|bash)\b" \
    "id:100030,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Custom WAF Rule: Blocked OS Command Injection Chaining',\
    tag:'attack-rce'"
